
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام ادارة المدارس</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ====== متغيرات الألوان ====== */
    :root {
      --gold: #d4af37;
      --red: #ce1126;
      --gold-glow: rgba(212, 175, 55, 0.5);
    }

    .loader-all {
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: transparent;
    }

    /* ====== حاوية تأثير التحميل ====== */
    .loader {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ====== الشعار ====== */
    .loader img {
      width: 130px;
      z-index: 1;
      animation: reveal-clip 3s infinite ease-in-out;
      filter: drop-shadow(0 0 20px var(--gold-glow));
    }

    /* ====== حلقة SVG المتوهجة ====== */
    .ring {
      position: absolute;
      width: 200px;
      height: 200px;
    }

    .ring circle {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 400;
      animation: ring-dash 3s infinite ease-in-out;
    }

    /* ====== حركة الكشف الدائري للشعار ====== */
    @keyframes reveal-clip {
      0% {
        clip-path: circle(0% at 50% 50%);
        opacity: 0.3;
      }

      50% {
        clip-path: circle(75% at 50% 50%);
        opacity: 1;
      }

      70% {
        clip-path: circle(75% at 50% 50%);
        opacity: 1;
      }

      100% {
        clip-path: circle(0% at 50% 50%);
        opacity: 0.3;
      }
    }

    /* ====== حركة الحلقة المتوهجة ====== */
    @keyframes ring-dash {
      0% {
        stroke-dashoffset: 400;
        stroke: var(--gold);
      }

      50% {
        stroke-dashoffset: 0;
        stroke: var(--red);
      }

      100% {
        stroke-dashoffset: -400;
        stroke: var(--gold);
      }
    }

    /* ====== النص المتحرك ====== */
    .loading-text {
      color: var(--gold);
      font-size: 1.4rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      letter-spacing: 1px;
      text-shadow: 0 0 10px var(--gold-glow);
    }

    .dots {
      display: flex;
      margin-right: 8px;
      /* مسافة بين النص والنقاط في اتجاه اليمين لليسار */
      direction: ltr;
      /* للحفاظ على ترتيب النقاط بشكل صحيح */
    }

    .dots span {
      animation: blink 1.4s infinite both;
      margin: 0 2px;
      font-size: 1.8rem;
      line-height: 1;
    }

    .dots span:nth-child(1) {
      animation-delay: 0s;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0% {
        opacity: 0.2;
        transform: translateY(0);
      }

      20% {
        opacity: 1;
        transform: translateY(-3px);
      }

      100% {
        opacity: 0.2;
        transform: translateY(0);
      }
    }
  </style>
</head>
