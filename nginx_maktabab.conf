# ==============================================================================
# إعدادات Nginx المعتمدة لموقع: https://maktabab.opensoftye.net
# Nginx Production Configuration for Question Bank & OMR System
# ==============================================================================

# ── 1. التحويل التلقائي من HTTP إلى HTTPS المشفر ──
server {
    listen 80;
    listen [::]:80;
    server_name maktabab.opensoftye.net;

    # مسار التحقق لشهادات Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # إعادة التوجيه إلى HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. خادم HTTPS المشفر (Production Server) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maktabab.opensoftye.net;

    # شهادات الأمان SSL (تعديل المسار حسب إعدادات السيرفر أو Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/maktabab.opensoftye.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maktabab.opensoftye.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # حجم الملفات المسموح برفعها (100MB لنماذج التصحيح وملفات الـ PDF عالية الدقة)
    client_max_body_size 100M;

    # 1. الواجهة الأمامية - Frontend Pre-built (dist)
    location / {
        root /var/www/NewQuestionBank/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # التخزين المؤقت للأصول الثابتة
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. ملفات الوسائط المرفوعة (Media)
    location /media/ {
        alias /var/www/NewQuestionBank/backend/media/;
        expires 7d;
        access_log off;
    }

    # 3. ملفات Django الثابتة (Static)
    location /static/ {
        alias /var/www/NewQuestionBank/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    # 4. توجيه جميع طلبات الـ API والباك إند إلى Django (Gunicorn / Daphne)
    # المنفذ الافتراضي للباك إند 8000 أو 5001
    location ~ ^/(api|admin|screens|auth|choices|user-manager|swagger|redoc|platform-sync|sso)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-SSL on;
        
        # مهلة الاتصال لمعالجة تصحيح أوراق OMR والذكاء الاصطناعي
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 5. دعم الـ WebSocket (Daphne للدردشة والتنبيهات المباشرة)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
